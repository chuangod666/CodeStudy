<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 选择器</title>
    <style>
        h2{
            color:aqua;
        }
        
        .highlight{
            color: yellow;
        }

       #header{
            color: black;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>不同类型的css选择器</h1>
    <h2>这是一个元素选择器示例</h2>
    <h3 class="highlight">这是一个类选择器 主要看这个</h3>
    <h3>这是另一个类选择器示例</h3>
    <h4 id="header">这是一个ID选择器示例 这个没人用</h4>
</body>
</html>
