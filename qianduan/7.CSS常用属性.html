<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=sc, initial-scale=1.0">
    <title>css 常用属性</title>
    <style>
        .block{
            background-color: aqua;
            width: 150px;
            height: 100px;
        }
        .inline{
            background-color: brown;
        }
        .inline-block{
            width: 250px;
            height: 200px;
        }
        .div-inline{
            display: inline;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <h1 style="font : bolder 50px 'kaiTi';">这是一个font复合属性示例</h1>
    <h2 style="line-height: 40px;">这是一段长文本以来检查行高等这是一段长文本以来检查行高这是一段长文本以来检查行高这是一段长文本以来检查行高这是一段长文本以来检查行高这是一段长文本以来检查行高这是一段长文本以来检查行高这是一段长文本以来检查行高这是一段长文本以来检查行高这是一段长文本以来检查行高这是一段长文本以来检查行高</h2>
    


    <div class="block">这是一个块级元素</div>
    <span class="inline">这是一个行内元素</span>
    <img src="./许哥.jpg" alt="图片加载失败" class="inline-block">
    <div class="div-inline">这是一个转换成行内元素的div标签</div>
</body>
</html>
